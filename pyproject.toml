[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dia2"
version = "0.1.0"
description = "Dia2 ROCm-only text-to-speech runtime"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Dia Contributors" }]
license = { file = "LICENSE" }
dependencies = [
  "torch",
  "torchvision",
  "numpy>=2.1.0,<3.0",
  "transformers>=4.55.3",
  "safetensors==0.5.3",
  "huggingface-hub>=0.24.7",
  "sphn>=0.2.0",
  "soundfile>=0.12.1",
  "whisper-timestamped>=1.14.2",
  "gradio>=4.44.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.9",
  "pyright>=1.1.385",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm62" },
]
torchvision = [
  { index = "pytorch-rocm62" },
]

[[tool.uv.index]]
name = "pytorch-rocm62"
url = "https://download.pytorch.org/whl/rocm6.2"

[tool.setuptools]
packages = ["dia2"]