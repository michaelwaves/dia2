[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dia2"
version = "0.1.0"
description = "Dia2 ROCm text-to-speech runtime"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Dia Contributors" }]
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.8.0",
  "numpy>=2.1.0,<3.0",
  "transformers>=4.55.3",
  "safetensors==0.5.3",
  "huggingface-hub>=0.24.7",
  "sphn>=0.2.0",
  "soundfile>=0.12.1",
  "whisper-timestamped>=1.14.2",
  "gradio>=4.44.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.9",
  "pyright>=1.1.385",
]

[tool.uv]
package = true

[tool.uv.sources]
# Only Linux supports ROCm; macOS/Windows should use normal PyPI torch.
torch = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch-rocm"
# Use ROCm 7.0 nightly build (recommended)
url = "https://download.pytorch.org/whl/nightly/rocm7.0"
explicit = true

[tool.setuptools]
packages = ["dia2"]
